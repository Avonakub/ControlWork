<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Измены — Серия 1: Домой</title>
  <style>
    :root {
      --bg: #14181f;
      --card: #1f252e;
      --text: #eef0f3;
      --muted: #96a0ae;
      --accent: #5b9fd4;
      --stroke: #3a424f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 12px 40px;
    }
    .badge { color: var(--muted); font-size: 0.85rem; margin: 0 0 6px; text-align: center; }
    h1 { font-size: 1.65rem; margin: 0 0 4px; text-align: center; }
    .lead { color: var(--muted); font-size: 0.92rem; text-align: center; max-width: 560px; margin: 0 0 18px; line-height: 1.45; }
    .player {
      width: 100%;
      max-width: 900px;
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: 14px;
      padding: 12px;
    }
    .frame-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 10px;
      background: #0a0c10;
      border: 1px solid var(--stroke);
    }
    .frame-wrap img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.8s ease;
      transform: scale(1.02);
    }
    .frame-wrap img.active {
      opacity: 1;
      animation: kenburns 6s ease-out forwards;
    }
    @keyframes kenburns {
      from { transform: scale(1.04); }
      to { transform: scale(1.12); }
    }
    .ep-label {
      position: absolute;
      top: 12px;
      left: 14px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,0.7);
      z-index: 2;
    }
    .meta { margin-top: 14px; padding: 0 4px; }
    .meta h2 { margin: 0 0 8px; font-size: 1.25rem; }
    .caption { margin: 0 0 12px; line-height: 1.55; min-height: 3em; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .count { color: var(--muted); font-size: 0.85rem; }
    .progress { height: 4px; background: var(--stroke); border-radius: 2px; overflow: hidden; margin-bottom: 14px; }
    .progress > div { height: 100%; background: var(--accent); width: 0%; transition: width 0.2s linear; }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button.sec { background: transparent; border: 1px solid var(--stroke); color: var(--text); margin-left: 8px; }
    .thumbs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      max-width: 900px;
      width: 100%;
      margin-top: 20px;
    }
  @media (max-width: 640px) { .thumbs { grid-template-columns: repeat(2, 1fr); } }
    .thumbs button {
      padding: 0;
      background: none;
      border: 2px solid transparent;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 16/9;
    }
    .thumbs button.sel { border-color: var(--accent); }
    .thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cast {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-width: 900px;
      width: 100%;
      margin-top: 20px;
    }
    @media (max-width: 520px) { .cast { grid-template-columns: 1fr; } }
    .cast figure { margin: 0; background: var(--card); border: 1px solid var(--stroke); border-radius: 10px; overflow: hidden; }
    .cast img { width: 100%; display: block; aspect-ratio: 3/4; object-fit: cover; }
    .cast figcaption { padding: 10px; font-size: 0.85rem; color: var(--muted); }
    .cast strong { color: var(--text); display: block; margin-bottom: 2px; }
  </style>
</head>
<body>
  <p class="badge">Мультсериал по мотивам «Измены» · фан-проект</p>
  <h1>Серия 1: Домой</h1>
  <p class="lead">Полноценные мультяшные кадры — Лера у Марка, утром едет домой к Андрею.</p>

  <div class="player">
    <div class="frame-wrap" id="frameWrap">
      <span class="ep-label">СЕРИЯ 1</span>
    </div>
    <div class="meta">
      <div class="row">
        <h2 id="sceneTitle">Утро</h2>
        <span class="count" id="sceneCount">1 / 8</span>
      </div>
      <p class="caption" id="sceneText"></p>
      <div class="progress"><div id="bar"></div></div>
      <div>
        <button type="button" id="btnPlay">Пауза</button>
        <button type="button" class="sec" id="btnRestart">Сначала</button>
      </div>
    </div>
  </div>

  <div class="thumbs" id="thumbs" aria-label="Сцены"></div>

  <div class="cast">
    <figure>
      <img src="assets/heroine-cartoon.jpg" alt="Лера" />
      <figcaption><strong>Лера</strong>Главная героиня</figcaption>
    </figure>
    <figure>
      <img src="assets/men-cartoon-pair.jpg" alt="Андрей и Марк" />
      <figcaption><strong>Андрей и Марк</strong>Муж и любовник</figcaption>
    </figure>
    <figure>
      <img src="assets/izmeny-ep1-title.jpg" alt="Титр" />
      <figcaption><strong>Титр</strong>Серия 1</figcaption>
    </figure>
  </div>

  <script>
    const SCENES = [
      { title: "Утро", text: "Лера просыпается не в своей постели. За окном — чужой двор.", img: "assets/ep1-scene01-utro.jpg", ms: 6000 },
      { title: "Он", text: "Марк спит. Ей нельзя будить — только взять пальто и уйти тихо.", img: "assets/ep1-scene02-on.jpg", ms: 5500 },
      { title: "Зеркало", text: "В отражении — вчерашняя она и та, что пойдёт домой.", img: "assets/ep1-scene03-zerkalo.jpg", ms: 6000 },
      { title: "Решение", text: "Такси уже едет. На экране: «Доброе утро, солнышко». Это муж.", img: "assets/ep1-scene04-taksi.jpg", ms: 6000 },
      { title: "Подъезд", text: "Своя лестница, знакомый запах. Сердце бьётся быстрее.", img: "assets/ep1-scene05-podezd.jpg", ms: 5500 },
      { title: "Кухня", text: "Андрей наливает кофе. Он думает, что она была у подруги.", img: "assets/ep1-scene06-kuhnya.jpg", ms: 6000 },
      { title: "Дверь", text: "Щелчок ключа. Два мира встречаются в коридоре.", img: "assets/ep1-scene07-dver.jpg", ms: 6000 },
      { title: "Домой", text: "Объятие. Правду никто не говорит. Сериал только начался.", img: "assets/ep1-scene08-domoy.jpg", ms: 7500 },
    ];

    const wrap = document.getElementById("frameWrap");
    const thumbs = document.getElementById("thumbs");
    const images = SCENES.map((sc, i) => {
      const img = document.createElement("img");
      img.src = sc.img;
      img.alt = sc.title;
      img.loading = i < 2 ? "eager" : "lazy";
      wrap.appendChild(img);
      const tb = document.createElement("button");
      tb.type = "button";
      tb.title = sc.title;
      const ti = document.createElement("img");
      ti.src = sc.img;
      ti.alt = "";
      tb.appendChild(ti);
      tb.addEventListener("click", () => jumpTo(i));
      thumbs.appendChild(tb);
      return { img, tb };
    });

    let sceneIndex = 0;
    let localT = 0;
    let playing = true;
    let sceneStart = performance.now();
    let raf;

    function jumpTo(i) {
      sceneIndex = i;
      localT = 0;
      sceneStart = performance.now();
      playing = true;
      document.getElementById("btnPlay").textContent = "Пауза";
      render();
    }

    function render() {
      images.forEach(({ img, tb }, i) => {
        const on = i === sceneIndex;
        img.classList.toggle("active", on);
        if (on) img.style.animation = "none";
        if (on) void img.offsetWidth;
        if (on) img.style.animation = "";
        tb.classList.toggle("sel", on);
      });
      const sc = SCENES[sceneIndex];
      document.getElementById("sceneTitle").textContent = sc.title;
      document.getElementById("sceneText").textContent = sc.text;
      document.getElementById("sceneCount").textContent = `${sceneIndex + 1} / ${SCENES.length}`;
      document.getElementById("bar").style.width = `${((sceneIndex + localT) / SCENES.length) * 100}%`;
    }

    function tick(now) {
      if (playing) {
        const sc = SCENES[sceneIndex];
        const elapsed = now - sceneStart;
        localT = elapsed / sc.ms;
        if (localT >= 1) {
          if (sceneIndex < SCENES.length - 1) {
            sceneIndex++;
            localT = 0;
            sceneStart = now;
          } else {
            localT = 1;
            playing = false;
            document.getElementById("btnPlay").textContent = "Сначала";
          }
        }
        render();
      }
      raf = requestAnimationFrame(tick);
    }

    document.getElementById("btnPlay").onclick = () => {
      if (sceneIndex === SCENES.length - 1 && localT >= 1 && !playing) {
        jumpTo(0);
        return;
      }
      playing = !playing;
      document.getElementById("btnPlay").textContent = playing ? "Пауза" : "Играть";
      if (playing) sceneStart = performance.now() - localT * SCENES[sceneIndex].ms;
    };
    document.getElementById("btnRestart").onclick = () => jumpTo(0);

    render();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
